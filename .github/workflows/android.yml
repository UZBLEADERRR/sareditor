name: Build & test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Typecheck and render tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The render tests drive a real ffmpeg. libass, libx264, libmp3lame and
      # vid.stab are all needed; Ubuntu's package carries them.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Render tests
        run: npm test

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # ffmpeg-kit's Maven Central artifacts were withdrawn in 2025, so the AAR
      # is mirrored into ./vendor/m2 before Gradle ever tries to resolve it.
      # Set the FFMPEG_KIT_AAR_URL variable or secret to use your own mirror.
      - name: Fetch ffmpeg-kit binaries
        env:
          FFMPEG_KIT_AAR_URL: ${{ vars.FFMPEG_KIT_AAR_URL || secrets.FFMPEG_KIT_AAR_URL }}
        run: npm run ffmpeg:fetch

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sar-editor-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
