name: Probe ffmpeg-kit mirrors

# Throwaway diagnostic: this sandbox cannot reach Maven mirrors, so the runner
# is used to find out which sources still carry the withdrawn ffmpeg-kit AARs.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List com/arthenica on public Maven mirrors
        run: |
          set +e
          for base in \
            "https://repo1.maven.org/maven2" \
            "https://maven.aliyun.com/repository/public" \
            "https://maven.aliyun.com/repository/central" \
            "https://mirrors.cloud.tencent.com/nexus/repository/maven-public" \
            "https://repo.huaweicloud.com/repository/maven" \
            "https://maven-central.storage-download.googleapis.com/maven2" \
            "https://maven-central-asia.storage-download.googleapis.com/maven2" \
            "https://repository.mulesoft.org/nexus/content/repositories/public" \
            "https://packages.atlassian.com/maven-central" \
            "https://repo.spring.io/plugins-release" \
            "https://plugins.gradle.org/m2" \
          ; do
            echo "=================================================="
            echo "MIRROR $base"
            body=$(curl -sS -L --max-time 25 "$base/com/arthenica/" 2>&1 | head -c 4000)
            echo "$body" | grep -oE 'href="[^"]+"' | head -20
            echo "-- direct AAR probes --"
            for art in ffmpeg-kit-full-gpl ffmpeg-kit-full ffmpeg-kit-https mobile-ffmpeg-full-gpl; do
              for ver in 6.0-2 6.0.LTS 5.1 4.4; do
                code=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 20 \
                  "$base/com/arthenica/$art/$ver/$art-$ver.aar")
                [ "$code" = "200" ] && echo "  HIT $code $base/com/arthenica/$art/$ver/$art-$ver.aar"
              done
            done
          done
          echo "done"

      - name: Probe GitHub release assets on known forks
        run: |
          set +e
          for repo in \
            arthenica/ffmpeg-kit \
            2004durgesh/ffmpeg-kit \
            Daniel-Griffiths/expo-ffmpeg \
            wokcito/ffmpeg-kit \
            AlexTech01/ffmpeg-kit \
          ; do
            echo "=================================================="
            echo "REPO $repo"
            curl -sS --max-time 25 -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$repo/releases?per_page=10" \
              | python3 -c "
import json,sys
try: d=json.load(sys.stdin)
except Exception as e: print('  parse error', e); sys.exit()
if isinstance(d,dict): print('  ', d.get('message','?')); sys.exit()
for r in d:
    print('  tag', r['tag_name'])
    for a in r.get('assets',[]):
        print('     ', a['name'], a['size'], a['browser_download_url'])
" 2>&1 | head -40
          done
          echo "done"

      - name: Search GitHub for repositories publishing the AAR
        run: |
          set +e
          curl -sS --max-time 25 -H "Accept: application/vnd.github+json" \
            "https://api.github.com/search/repositories?q=ffmpeg-kit+aar+in:name,description,readme&per_page=15" \
            | python3 -c "
import json,sys
d=json.load(sys.stdin)
for r in d.get('items',[]):
    print(r['full_name'], '|', r.get('stargazers_count'), '|', (r.get('description') or '')[:80])
" 2>&1 | head -20
          echo "done"
