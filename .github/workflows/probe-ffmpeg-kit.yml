name: Probe ffmpeg-kit mirrors

# Throwaway diagnostic. The development sandbox has no route to Maven mirrors,
# so the runner does the looking and reports which sources still serve the
# withdrawn ffmpeg-kit AARs. Deleted once a working source is pinned.
on:
  push:
    branches: ['claude/**']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe mirrors and forks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/probe-ffmpeg-mirrors.mjs
